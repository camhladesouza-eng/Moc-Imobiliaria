<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOC Imobiliária</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #222;
    }
    header {
      background: #171717;
      color: white;
      padding: 24px;
      text-align: center;
    }
    nav {
      background: #b49a65;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: #171717;
      margin: 12px;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      padding: 70px 20px;
      text-align: center;
    }
    .botao {
      display: inline-block;
      background: #b49a65;
      color: #171717;
      padding: 15px 25px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>MOC IMOBILIÁRIA</h1>
    <p>Seu próximo imóvel começa aqui.</p>
  </header>

  <nav>
    <a href="#inicio">Início</a>
    <a href="#imoveis">Imóveis</a>
    <a href="#contato">Contato</a>
  </nav>

  <main id="inicio">
    <h2>Encontre o imóvel ideal</h2>
    <p>Casas, apartamentos e terrenos para você.</p>
    <a class="botao" href="#imoveis">Ver imóveis</a>
  </main>

  <section id="imoveis" style="text-align:center;padding:40px">
    <h2>Nossos imóveis</h2>
    <p>Em breve, imóveis disponíveis aqui.</p>
  </section>

  <footer id="contato" style="text-align:center;padding:30px">
    <p>Entre em contato com a MOC Imobiliária</p>
  </footer>
</body>
</html>
